name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Placeholder scripts (exit 0) — replaced with real lint/test in T1.2.
      # Keeping them explicit preserves the CI contract from day one.
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
